{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  {% block meta %} {% endblock meta %}
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a href="{% url 'main:show_main' %}" class="brand">{{ name }}</a>
      <nav>
        <a href="{% url 'main:show_main' %}">Profile</a>
        <a href="{% url 'main:show_experience' %}">Experience</a>
        <a href="{% url 'main:show_projects' %}">Projects</a>
      </nav>
    </div>
  </header>

  {% if messages %}
    <div class="container" style="margin-top: 1rem;">
      {% for message in messages %}
        <div class="alert alert-{{ message.tags }}" style="padding: 0.75rem 1.25rem; margin-bottom: 1rem; border-radius: 6px; background-color: #e0f2fe; color: #0369a1; border: 1px solid #bae6fd;">
          {{ message }}
        </div>
      {% endfor %}
    </div>
  {% endif %}

  {% block content %} {% endblock content %}

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 {{ name }}. Fakultas Ilmu Komputer, Universitas Indonesia.</p>
    </div>
  </footer>
</body>
</html>
