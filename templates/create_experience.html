{% extends 'base.html' %}

{% block content %}
<div style="max-width: 600px; margin: 40px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px; background: #fff;">
    <h2>Tambah Experience Baru</h2>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" style="padding: 8px 16px; background-color: #0284c7; color: white; border: none; border-radius: 4px; cursor: pointer;">Simpan</button>
    </form>
</div>
{% endblock %}
