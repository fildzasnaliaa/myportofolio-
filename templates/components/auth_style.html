<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        background: linear-gradient(135deg, #d6e4f0 0%, #b9d2e6 100%);
        font-family: 'Inter', sans-serif;
        color: #1f2937;
    }

    .header-nav {
        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
        padding: 20px 40px;
        background: rgba(255, 255, 255, 0.5);
        backdrop-filter: blur(8px);
    }

    .header-nav .brand-name { font-weight: 700; font-size: 16px; color: #222; }
    .header-nav .nav-right { display: flex; gap: 20px; flex-wrap: wrap; }
    .header-nav .nav-right a { text-decoration: none; color: #333; font-size: 14px; font-weight: 500; }
    .header-nav .nav-right a:hover { color: #0284c7; }

    .auth-card {
        width: min(420px, calc(100% - 32px));
        margin: 48px auto;
        background: #fffdf9;
        padding: 36px 32px;
        border-radius: 20px;
        border: 1px solid rgba(255, 255, 255, 0.8);
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
    }

    .sub-header {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        color: #0284c7;
        margin-bottom: 6px;
    }

    .page-title { font-size: 26px; font-weight: 700; color: #1e3a8a; margin-bottom: 20px; }

    .form-styled p { display: flex; flex-direction: column; margin-bottom: 16px; font-size: 13px; }
    .form-styled label { font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 6px; }

    .form-styled input {
        width: 100%;
        padding: 10px 14px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        font-size: 14px;
        font-family: inherit;
        outline: none;
    }

    .form-styled input:focus {
        border-color: #0284c7;
        box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
    }

    .form-styled .helptext,
    .form-styled ul { font-size: 12px; color: #64748b; margin-top: 4px; padding-left: 16px; }

    .errorlist { color: #b91c1c; font-size: 13px; margin-bottom: 12px; padding-left: 16px; }

    .btn-submit {
        width: 100%;
        background-color: #0284c7;
        color: #fff;
        border: none;
        padding: 12px 18px;
        border-radius: 8px;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
        margin-top: 8px;
    }

    .btn-submit:hover { background-color: #0369a1; }

    .auth-switch { margin-top: 18px; font-size: 13px; text-align: center; color: #475569; }
    .auth-switch a { color: #0284c7; font-weight: 600; }

    .alert {
        padding: 10px 14px;
        margin-bottom: 16px;
        border-radius: 8px;
        background-color: #e0f2fe;
        color: #0369a1;
        border: 1px solid #bae6fd;
        font-size: 13px;
    }

    footer {
        width: 100%;
        text-align: center;
        padding: 15px 0;
        background: rgba(255, 255, 255, 0.4);
        backdrop-filter: blur(5px);
        font-size: 12px;
        color: #444;
    }
</style>
